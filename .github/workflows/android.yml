name: Android CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (debug)
    runs-on: ubuntu-latest
    # Needed to publish the APK as a downloadable Release asset.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (workflow artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hematoscope-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the APK to a rolling pre-release so it has a direct, login-free
      # download link (the app is installable straight from a phone browser).
      - name: Publish debug APK to a rolling pre-release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: HematoScope · APK de depuración (última compilación)
          prerelease: true
          body: |
            APK de depuración generado automáticamente desde la rama de desarrollo.
            Descárguelo e instálelo en Android (habilite "instalar de orígenes
            desconocidos"). Compilación: ${{ github.sha }}.
          files: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
