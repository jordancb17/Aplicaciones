name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: titanes-de-guerra-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar release con el APK
        if: github.ref == 'refs/heads/main' || contains(github.ref, 'titans-style-game-apk')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'Titanes de Guerra — APK más reciente'
          body: |
            APK generado automáticamente a partir del último commit.
            Descarga `titanes-de-guerra.apk`, ábrelo en tu Android y acepta la instalación de orígenes desconocidos.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
