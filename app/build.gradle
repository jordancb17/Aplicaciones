plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jordancb.titanesdeguerra'
    compileSdk 35

    defaultConfig {
        applicationId "com.jordancb.titanesdeguerra"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alinea las versiones de kotlin-stdlib que traen las dependencias de AndroidX
    // (evita clases duplicadas entre kotlin-stdlib 1.8.x y kotlin-stdlib-jdk7/8 1.6.x)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
